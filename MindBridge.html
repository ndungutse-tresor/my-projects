// Story content stored in template literals to safely handle apostrophes and quotes
const s1Content = `I was in my second year when everything collapsed. Failing two courses, barely sleeping four hours a night, and convinced that I was the only one struggling. I remember sitting in the library bathroom crying between study sessions, hoping no one would hear me.\n\nThe turning point came when I finally opened up to one of the peer supporters on campus. She didn't try to fix me—she just listened and told me about MindBridge. I was scared to apply. What if someone found out? What if it went on my record?\n\nBut I took that step, and it changed everything. My counselor helped me understand that anxiety is not a character flaw—it's a signal. We worked on breathing techniques, realistic study schedules, and most importantly, how to talk to myself with kindness.\n\nSix months later, I passed all my courses. A year later, I was a peer supporter myself. If you are reading this in pain right now, please know: this pain is temporary, and help is real.`;

const s2Content = `Three weeks. That is how long I stayed in my room, only leaving to use the bathroom when I was sure my roommate was asleep. I convinced myself that everyone was better off without my presence in lectures, in social spaces, everywhere.\n\nIt was my roommate who noticed the food I wasn't eating. She didn't lecture me or call anyone without my permission. She sat on my bed and said, "I see you. You matter."\n\nShe helped me access MindBridge. The video counseling feature was the only reason I agreed—I couldn't face anyone seeing my swollen eyes, my unwashed state, my shame. The anonymous sessions gave me the space to fall apart safely.\n\nSlowly, week by week, I started to rebuild. One class attended. Then two. One social interaction. Then another. My counselor told me healing isn't linear, and she was right. I had setbacks. But I also had support.\n\nI graduated last month. I wore my cap and gown and cried—this time from joy.`;

const s3Content = `In my culture, you don't talk about your problems. You endure. You are strong. Asking for help is weakness—at least, that is what I believed for 20 years.\n\nMy first year at university, I carried everything alone: the financial stress, the grief from my father's illness, the crushing pressure to succeed for my whole family. I smiled in every lecture. I laughed at every social event. And I went home and stared at the ceiling.\n\nA professor noticed my assignment quality dropping. Instead of grading me down, she quietly sent me a link to MindBridge. "No pressure," she said. "Just something to know about."\n\nI almost didn't click it. But one night at 2am, when the ceiling felt like it was closing in, I did.\n\nThe anonymity mattered enormously. I could speak without my face being seen, my voice changed, my identity protected. For the first time, I could say "I'm not okay" without shame.\n\nNow I am a peer supporter. I share my story because I know someone out there needs to hear: asking for help is the bravest thing you can do.`;

const s4Content = `The phone call came on a Tuesday morning, one hour before my biology exam. I sat in the exam hall anyway, because I didn't know what else to do.\n\nGrief in university is invisible. Professors still expect assignments. Exams don't pause. The academic calendar doesn't bend for loss. I was drowning while everyone around me was just... attending class.\n\nMindBridge helped me in two concrete ways. First, my counselor helped me navigate the university's compassionate leave process—paperwork I would never have found on my own. Second, she gave me grief tools that actually worked: the permission to feel without judgment, the importance of small daily anchors, the understanding that grief doesn't follow a schedule.\n\nI also read the stories in this library during my worst nights. Reading that others had walked through fire and come out the other side gave me something I can only describe as borrowed hope. When you don't have hope of your own, you borrow it from others until yours grows back.\n\nMine grew back. I think yours will too.`;

const SEED_STORIES = [

  { id:'s2', title:'Depression almost took my degree — here is what saved me', author:'Anonymous Student', authorColor:'#8b5cf6', tags:['Depression','Resilience','Peer Support'], excerpt:'I stopped attending classes for three weeks. My friends did not know. My parents did not know. But inside, I was disappearing...', content:s2Content, likes:203, views:1204, date:'2024-01-05', category:'Depression' },
  { id:'s3', title:'Learning to ask for help changed my life', author:'Hope I. (Peer Supporter)', authorColor:'#38c88c', tags:['Peer Support','Self-Worth','Community'], excerpt:'Growing up, asking for help felt like admitting defeat. Until the day I realized that strength and vulnerability are not opposites...', content:s3Content, likes:167, views:932, date:'2023-12-20', category:'Self-Worth' },
  { id:'s4', title:'Navigating grief while keeping my GPA', author:'Anonymous Student', authorColor:'#f59e0b', tags:['Grief','Loss','Coping Strategies'], excerpt:'My mother passed away mid-semester. The university system felt cold and impossible. MindBridge became my anchor...', content:s4Content, likes:89, views:614, date:'2023-11-30', category:'Grief & Loss' },
];

// ─── Utility Components ───────────────────────────────────────────────────────
function Avatar({ name, color, size=40, fontSize=16 }) {
  const initials = name.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
  return (
    <div style={{width:size,height:size,borderRadius:'50%',background:color||'#5b6cf9',display:'flex',alignItems:'center',justifyContent:'center',fontSize,fontWeight:700,color:'#fff',flexShrink:0}}>
      {initials}
    </div>
  );
}

function Spinner() {
  return <div style={{width:24,height:24,border:'3px solid #e5e7eb',borderTopColor:'#5b6cf9',borderRadius:'50%',animation:'spin .7s linear infinite'}} />;
}

function Modal({ show, onClose, title, children, wide }) {
  if (!show) return null;
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={wide?{maxWidth:680}:{}}>
        <div className="modal-header">
          <h3 style={{fontSize:18,fontWeight:700}}>{title}</h3>
          <button className="close-btn" onClick={onClose}><i className="fas fa-times" /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

// ─── Landing / Auth ───────────────────────────────────────────────────────────
function LandingPage({ onLogin, users, setUsers, applications, setApplications }) {
  const [mode, setMode] = useState('home'); // home | login | register | apply
  const [form, setForm] = useState({ email:'', password:'' });
  const [reg, setReg] = useState({ name:'', email:'', password:'', role:'student', studentId:'' });
  const [app, setApp] = useState({ name:'', email:'', studentId:'', issue:'', urgency:'medium' });
  const [error, setError] = useState('');
  const [success, setSuccess] = useState('');
  const [loading, setLoading] = useState(false);
  const [scrolled, setScrolled] = useState(false);
  useEffect(()=>{
    const fn=()=>setScrolled(window.scrollY>40);
    window.addEventListener('scroll',fn);
    return ()=>window.removeEventListener('scroll',fn);
  },[]);

  const handleLogin = (e) => {
    e.preventDefault(); setError(''); setLoading(true);
    setTimeout(()=>{
      const user = users.find(u=>u.email===form.email&&u.password===form.password);
      if (!user) { setError('Invalid email or password.'); setLoading(false); return; }
      onLogin(user); setLoading(false);
    },800);
  };

  const handleRegister = (e) => {
    e.preventDefault(); setError(''); setLoading(true);
    setTimeout(()=>{
      if (users.find(u=>u.email===reg.email)) { setError('Email already registered.'); setLoading(false); return; }
      const colors = ['#5b6cf9','#8b5cf6','#14b8a6','#f59e0b','#f43f5e','#38c88c'];
      const newUser = {
        id:'u'+(users.length+10), name:reg.name, email:reg.email, password:reg.password,
        role:reg.role==='peer'?'peer':'student', enrolled:false, applicationStatus:'none',
        avatar:reg.name.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase(),

// ─── Anonymous Video Call Room ────────────────────────────────────────────────
function VideoRoom({ onClose, counselor, student }) {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const [faceBlur, setFaceBlur] = useState(true);
  const [voiceChange, setVoiceChange] = useState(true);
  const [micOn, setMicOn] = useState(true);
  const [camOn, setCamOn] = useState(true);
  const [callTime, setCallTime] = useState(0);
  const [stream, setStream] = useState(null);
  const [permDenied, setPermDenied] = useState(false);
  const [connecting, setConnecting] = useState(true);
  const timerRef = useRef(null);

  useEffect(()=>{
    let st;
    (async()=>{
      setConnecting(true);
      await new Promise(r=>setTimeout(r,2000));
      setConnecting(false);
      try {
        const s = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
        setStream(s);
        if(videoRef.current) { videoRef.current.srcObject=s; videoRef.current.play(); }
      } catch(e) { setPermDenied(true); }
    })();
    timerRef.current = setInterval(()=>setCallTime(p=>p+1),1000);
    return ()=>{
      clearInterval(timerRef.current);
      if(stream) stream.getTracks().forEach(t=>t.stop());
    };
  },[]);

  const fmt = s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

  const endCall = ()=>{ if(stream) stream.getTracks().forEach(t=>t.stop()); onClose(); };

  return (
    <div style={{position:'fixed',inset:0,background:'#0f172a',zIndex:300,display:'flex',flexDirection:'column'}}>
      {/* Header */}
      <div style={{padding:'16px 24px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:'1px solid rgba(255,255,255,.1)'}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{width:10,height:10,borderRadius:'50%',background:connecting?'#f59e0b':'#38c88c',animation:connecting?'pulse 1s infinite':''}} />
          <span style={{color:'#fff',fontWeight:600}}>{connecting?'Connecting…':fmt(callTime)}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{background:'rgba(255,255,255,.1)',padding:'6px 14px',borderRadius:20,display:'flex',alignItems:'center',gap:8}}>
            <i className="fas fa-user-secret" style={{color:'#38c88c',fontSize:14}} />
            <span style={{color:'#e2e8f0',fontSize:13,fontWeight:600}}>Anonymous Mode</span>
          </div>
          <div style={{background:'rgba(255,255,255,.1)',padding:'6px 14px',borderRadius:20}}>
            <span style={{color:'#e2e8f0',fontSize:13}}>Session with Dr. {counselor||'Amara'}</span>
          </div>
        </div>
      </div>

      {/* Main video area */}
      <div style={{flex:1,display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,padding:24,alignItems:'stretch'}}>
        {/* Counselor side */}
        <div className="video-container" style={{position:'relative'}}>
          <div style={{position:'absolute',inset:0,background:'linear-gradient(135deg,#1e3a5f,#2d4a7a)',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12}}>
            <Avatar name="Amara Kamau" color="#5b6cf9" size={80} fontSize={28} />
            <span style={{color:'rgba(255,255,255,.8)',fontSize:15,fontWeight:600}}>Dr. Amara Kamau</span>
            <span style={{color:'rgba(255,255,255,.5)',fontSize:12}}>Counselor</span>
          </div>
          <div style={{position:'absolute',bottom:12,left:12,background:'rgba(0,0,0,.5)',padding:'4px 10px',borderRadius:20,color:'#fff',fontSize:12}}>Counselor</div>
        </div>

        {/* Student side (anonymous) */}
        <div className="video-container" style={{position:'relative'}}>
          {permDenied||!camOn ? (
            <div style={{position:'absolute',inset:0,background:'#1e293b',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12}}>
              <div style={{width:70,height:70,borderRadius:'50%',background:'rgba(255,255,255,.1)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:32}}>👤</div>

// ─── Add Story Page ───────────────────────────────────────────────────────────
function AddStoryPage({ user, stories, setStories }) {
  const [form, setForm] = useState({ title:'', excerpt:'', content:'', category:'Anxiety', tagInput:'', tags:[] });
  const [success, setSuccess] = useState(false);

  const addTag = () => {
    if(form.tagInput.trim()&&!form.tags.includes(form.tagInput.trim())) {
      setForm({...form,tags:[...form.tags,form.tagInput.trim()],tagInput:''});
    }
  };

  const submit = (e) => {
    e.preventDefault();
    const colors=['#5b6cf9','#8b5cf6','#14b8a6','#f59e0b','#f43f5e','#38c88c'];
    const newStory={
      id:'s'+(stories.length+10), title:form.title, author:user.role==='peer'?user.name+' (Peer Supporter)':'Anonymous Student',
      authorColor:colors[Math.floor(Math.random()*colors.length)], tags:form.tags, excerpt:form.excerpt,
      content:form.content, likes:0, views:0, date:new Date().toISOString().split('T')[0], category:form.category
    };
    setStories(prev=>[newStory,...prev]);
    setSuccess(true);
    setTimeout(()=>{ setSuccess(false); setForm({title:'',excerpt:'',content:'',category:'Anxiety',tagInput:'',tags:[]}); },3000);
  };

  return (
    <div className="animate-fade" style={{maxWidth:700}}>
      <div className="page-header"><div className="page-title">Share Your Story</div><div className="page-subtitle">Help others by sharing your healing journey</div></div>
      {success?(<div className="card" style={{textAlign:'center',padding:'48px'}}><div style={{fontSize:48,marginBottom:16}}>🌟</div><h3 style={{fontSize:20,fontWeight:700,marginBottom:8}}>Story Submitted!</h3><p style={{color:'#6b7280'}}>Your story will be reviewed and published to the library. Thank you for your courage.</p></div>):(
      <div className="card">
        <div className="alert alert-info" style={{marginBottom:20}}><i className="fas fa-user-secret"/><div>Your story will be published anonymously by default unless you choose to use your name.</div></div>
        <form onSubmit={submit}>
          <div className="form-group"><label className="label">Story Title *</label><input className="input" required value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="Give your story a meaningful title..." /></div>
          <div className="form-group"><label className="label">Category *</label>
            <select className="select" value={form.category} onChange={e=>setForm({...form,category:e.target.value})}>
              <option>Anxiety</option><option>Depression</option><option>Grief &amp; Loss</option><option>Self-Worth</option><option>Academic Stress</option><option>Other</option>
            </select>
          </div>
          <div className="form-group"><label className="label">Short Excerpt (2-3 sentences) *</label><textarea className="input" rows={3} required value={form.excerpt} onChange={e=>setForm({...form,excerpt:e.target.value})} placeholder="A brief teaser for your story..." /></div>
          <div className="form-group"><label className="label">Full Story *</label><textarea className="input" rows={10} required value={form.content} onChange={e=>setForm({...form,content:e.target.value})} placeholder="Share your full journey — where you started, what helped, where you are now..." /></div>
          <div className="form-group"><label className="label">Tags</label>
            <div style={{display:'flex',gap:8,marginBottom:8}}>
              <input className="input" placeholder="Add a tag..." value={form.tagInput} onChange={e=>setForm({...form,tagInput:e.target.value})} onKeyDown={e=>e.key==='Enter'&&(e.preventDefault(),addTag())} style={{flex:1}} />
              <button type="button" className="btn btn-outline btn-sm" onClick={addTag}><i className="fas fa-plus"/></button>
            </div>
            {form.tags.map(t=><span key={t} className="tag" style={{cursor:'pointer'}} onClick={()=>setForm({...form,tags:form.tags.filter(x=>x!==t)})}>{t} ×</span>)}
          </div>
          <button className="btn btn-primary" type="submit" style={{width:'100%',justifyContent:'center'}}><i className="fas fa-paper-plane"/>Publish Story</button>
        </form>
      </div>
      )}
    </div>
  );
}

// ─── Chat / Messages ──────────────────────────────────────────────────────────
function MessagesPage({ user, users, messages, setMessages }) {
  const [activeChat, setActiveChat] = useState(null);
  const [newMsg, setNewMsg] = useState('');
  const bottomRef = useRef(null);

  const contacts = users.filter(u => {
    if (u.id===user.id) return false;
    if (user.role==='student') return u.role==='counselor';
    if (user.role==='counselor') return u.role==='student'&&u.enrolled;
    if (user.role==='admin') return u.role==='counselor';
    if (user.role==='peer') return u.role==='student'&&u.enrolled;
    return false;
  });

  const convoWith = (uid) => messages.filter(m=>(m.from===user.id&&m.to===uid)||(m.to===user.id&&m.from===uid));
  const lastMsg = (uid) => { const msgs=convoWith(uid); return msgs[msgs.length-1]; };
  const unread = (uid) => convoWith(uid).filter(m=>m.from===uid&&!m.read).length;

  const sendMsg = () => {
    if(!newMsg.trim()||!activeChat) return;
    const msg={id:'msg'+Date.now(),from:user.id,to:activeChat.id,text:newMsg.trim(),time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),date:'Today'};
    setMessages(p=>[...p,msg]);
    setNewMsg('');
    // Simulate reply
    if(activeChat.role==='counselor') {
      const replies=["Thank you for sharing. How are you feeling right now?","I understand. Let's explore that further in our next session.","That's a great observation. Keep journaling about this.","Remember, progress isn't always linear. You're doing well."];
      setTimeout(()=>{
        setMessages(p=>[...p,{id:'msg'+(Date.now()+1),from:activeChat.id,to:user.id,text:replies[Math.floor(Math.random()*replies.length)],time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),date:'Today'}]);
      },1500+Math.random()*1000);
    }
  };

  useEffect(()=>{ if(bottomRef.current) bottomRef.current.scrollIntoView({behavior:'smooth'}); },[messages,activeChat]);

  const convo = activeChat ? convoWith(activeChat.id) : [];

  return (
    <div className="animate-fade">
      <div className="page-header"><div className="page-title">Messages</div><div className="page-subtitle">Secure messaging with your support team</div></div>
      <div className="card" style={{padding:0,overflow:'hidden'}}>
        <div style={{display:'grid',gridTemplateColumns:'280px 1fr',height:'60vh'}}>
          {/* Contact list */}
          <div style={{borderRight:'1px solid #f3f4f6',overflow:'auto'}}>
            <div style={{padding:'16px',borderBottom:'1px solid #f3f4f6',fontWeight:600,fontSize:14,color:'#374151'}}>Conversations</div>
            {contacts.length===0&&<div style={{padding:20,color:'#9ca3af',fontSize:14,textAlign:'center'}}>No contacts yet</div>}
            {contacts.map(c=>{
              const lm=lastMsg(c.id); const cnt=unread(c.id);
              return (
                <div key={c.id} onClick={()=>setActiveChat(c)} style={{padding:'14px 16px',cursor:'pointer',background:(activeChat&&activeChat.id===c.id)?'#eef0ff':'transparent',borderBottom:'1px solid #f9fafb',display:'flex',gap:12,alignItems:'center',transition:'background .15s'}}>
                  <div style={{position:'relative'}}>
                    <Avatar name={c.name} color={c.color} size={40} />
                    {c.online&&<div style={{width:10,height:10,borderRadius:'50%',background:'#38c88c',position:'absolute',bottom:0,right:0,border:'2px solid #fff'}} />}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <span style={{fontWeight:600,fontSize:14,color:'#1f2937'}}>{c.name.split(' ')[0]} {c.name.split(' ')[1]?c.name.split(' ')[1][0]+'.':''}</span>
                      {cnt>0&&<span style={{background:'#5b6cf9',color:'#fff',borderRadius:'50%',width:18,height:18,fontSize:11,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700}}>{cnt}</span>}
                    </div>
                    <div style={{fontSize:12,color:'#9ca3af',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{lm?lm.text:'No messages yet'}</div>
                  </div>
                </div>
              );
            })}
          </div>
          {/* Chat area */}
          {activeChat ? (
            <div style={{display:'flex',flexDirection:'column'}}>
              <div style={{padding:'14px 20px',borderBottom:'1px solid #f3f4f6',display:'flex',alignItems:'center',gap:12}}>
                <Avatar name={activeChat.name} color={activeChat.color} size={36} />
                <div><div style={{fontWeight:600,fontSize:15}}>{activeChat.name}</div><div style={{fontSize:12,color:activeChat.online?'#38c88c':'#9ca3af'}}>{activeChat.online?'Online':'Offline'}</div></div>
                <div style={{marginLeft:'auto',display:'flex',gap:8}}>
                  <button className="btn btn-outline btn-sm"><i className="fas fa-video"/>Video Call</button>
                </div>
              </div>
              <div style={{flex:1,overflow:'auto',padding:'20px',display:'flex',flexDirection:'column'}}>
                {convo.length===0&&<div style={{textAlign:'center',color:'#9ca3af',fontSize:14,marginTop:40}}>No messages yet. Say hello!</div>}
                {convo.map(m=>(
                  <div key={m.id} style={{marginBottom:12,display:'flex',flexDirection:m.from===user.id?'row-reverse':'row',alignItems:'flex-end',gap:8}}>
                    {m.from!==user.id&&<Avatar name={activeChat.name} color={activeChat.color} size={28} fontSize={11} />}
                    <div>
                      <div className={`chat-bubble ${m.from===user.id?'bubble-out':'bubble-in'}`}>{m.text}</div>
                      <div style={{fontSize:11,color:'#9ca3af',textAlign:m.from===user.id?'right':'left',marginTop:2}}>{m.time}</div>
                    </div>
                  </div>
                ))}
                <div ref={bottomRef}/>
              </div>
              <div style={{padding:'14px 20px',borderTop:'1px solid #f3f4f6',display:'flex',gap:10}}>
                <input className="input" value={newMsg} onChange={e=>setNewMsg(e.target.value)} onKeyDown={e=>e.key==='Enter'&&sendMsg()} placeholder="Type a message..." style={{flex:1}} />
                <button className="btn btn-primary btn-sm" onClick={sendMsg}><i className="fas fa-paper-plane"/></button>
              </div>
            </div>
          ) : (
            <div style={{display:'flex',alignItems:'center',justifyContent:'center',color:'#9ca3af',flexDirection:'column',gap:12}}>
              <i className="fas fa-comments" style={{fontSize:40,opacity:.4}}/>
              <span style={{fontSize:15}}>Select a conversation</span>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── Sessions Page ────────────────────────────────────────────────────────────

  const isStudent = user.role==='student';

  const userSessions = isStudent ? sessions.filter(s=>s.studentId===user.id) : isAdmin ? sessions : sessions;

    e.preventDefault();

          <div className="page-subtitle">Anonymous, safe, and confidential video sessions</div>

          <button className="btn btn-primary" onClick={()=>setShowBook(true)}><i className="fas fa-plus"/>Book Session</button>

        <i className="fas fa-user-secret"/>

          <strong>Anonymous by default.</strong> Your face is blurred and voice disguised in every video session.
          {isPeer && ' As a peer supporter, you join sessions to offer lived-experience support alongside the counselor.'}

      </div>

      {/* Quick-join practice card */}
      {((isStudent&&user.enrolled)||isPeer||isCounselor) && (
        <div className="card" style={{marginBottom:24,borderLeft:'4px solid #38c88c',display:'flex',alignItems:'center',gap:20}}>

              {isPeer

          </div>
          <button className="btn btn-success" onClick={()=>setInCall(true)}><i className="fas fa-video"/>Join Now</button>
        </div>
      )}

      <div style={{marginBottom:16,fontWeight:600,fontSize:16}}>Upcoming Sessions ({upcomingSessions.length})</div>
      <div style={{display:'flex',flexDirection:'column',gap:12,marginBottom:28}}>

// ─── Admin Applications ───────────────────────────────────────────────────────
function ApplicationsPage({ applications, setApplications, users, setUsers }) {
  const [selected, setSelected] = useState(null);
  const [filter, setFilter] = useState('pending');

  const approve = (app) => {
    setApplications(p=>p.map(a=>a.id===app.id?{...a,status:'approved'}:a));
    setUsers(p=>p.map(u=>u.email===app.email?{...u,enrolled:true,enrolledDate:new Date().toISOString().split('T')[0],applicationStatus:'approved'}:u));
    setSelected(null);
  };
  const reject = (app) => {
    setApplications(p=>p.map(a=>a.id===app.id?{...a,status:'rejected'}:a));
    setSelected(null);
  };

  const filtered = applications.filter(a=>a.status===filter);
  const urgencyColor = { low:'badge-gray', medium:'badge-warning', high:'badge-danger' };

  return (
    <div className="animate-fade">
      <div className="page-header"><div className="page-title">Enrollment Applications</div><div className="page-subtitle">Review and manage student support applications</div></div>
      <div style={{display:'flex',gap:8,marginBottom:20}}>
        {['pending','approved','rejected'].map(s=>(
          <button key={s} className={`btn btn-sm ${filter===s?'btn-primary':'btn-outline'}`} onClick={()=>setFilter(s)} style={{textTransform:'capitalize'}}>
            {s} ({applications.filter(a=>a.status===s).length})
          </button>
        ))}
      </div>
      <div className="card" style={{padding:0,overflow:'hidden'}}>
        <table className="table">
          <thead><tr><th>Student</th><th>Student ID</th><th>Urgency</th><th>Date</th><th>Status</th><th>Action</th></tr></thead>
          <tbody>
            {filtered.map(app=>(
              <tr key={app.id}>
                <td><div style={{fontWeight:600}}>{app.name}</div><div style={{fontSize:12,color:'#9ca3af'}}>{app.email}</div></td>
                <td style={{fontSize:13}}>{app.studentId}</td>
                <td><span className={`badge ${urgencyColor[app.urgency]}`}>{app.urgency}</span></td>
                <td style={{fontSize:13}}>{app.date}</td>
                <td><span className={`badge ${app.status==='pending'?'badge-warning':app.status==='approved'?'badge-success':'badge-danger'}`}>{app.status}</span></td>
                <td>
                  <div style={{display:'flex',gap:6}}>
                    <button className="btn btn-outline btn-sm" onClick={()=>setSelected(app)}><i className="fas fa-eye"/>View</button>
                    {app.status==='pending'&&<>
                      <button className="btn btn-success btn-sm" onClick={()=>approve(app)}><i className="fas fa-check"/>Approve</button>
                      <button className="btn btn-danger btn-sm" onClick={()=>reject(app)}><i className="fas fa-times"/></button>
                    </>}
                  </div>
                </td>
              </tr>
            ))}
            {filtered.length===0&&<tr><td colSpan={6} style={{textAlign:'center',color:'#9ca3af',padding:30}}>No {filter} applications</td></tr>}
          </tbody>
        </table>
      </div>
      <Modal show={!!selected} onClose={()=>setSelected(null)} title="Application Details">
        {selected&&<>
          <div style={{marginBottom:20}}>
            <div style={{display:'flex',gap:12,alignItems:'center',marginBottom:16}}>
              <Avatar name={selected.name} color="#5b6cf9" size={48} />
              <div><div style={{fontWeight:700,fontSize:16}}>{selected.name}</div><div style={{color:'#9ca3af',fontSize:13}}>{selected.email} · {selected.studentId}</div></div>
            </div>
            <div style={{display:'flex',gap:8,marginBottom:16}}>
              <span className={`badge ${urgencyColor[selected.urgency]}`}>{selected.urgency} urgency</span>
              <span className={`badge ${selected.status==='pending'?'badge-warning':selected.status==='approved'?'badge-success':'badge-danger'}`}>{selected.status}</span>
              <span className="badge badge-gray">{selected.date}</span>
            </div>
            <div style={{background:'#f9fafb',borderRadius:12,padding:'16px',fontSize:14,lineHeight:1.7,color:'#374151'}}>
              <div style={{fontWeight:600,marginBottom:8,color:'#6b7280',fontSize:12,textTransform:'uppercase',letterSpacing:'.05em'}}>Student's Description</div>
              {selected.issue}
            </div>
          </div>
          {selected.status==='pending'&&(
            <div style={{display:'flex',gap:12}}>
              <button className="btn btn-danger" style={{flex:1,justifyContent:'center'}} onClick={()=>reject(selected)}><i className="fas fa-times"/>Decline</button>
              <button className="btn btn-success" style={{flex:1,justifyContent:'center'}} onClick={()=>approve(selected)}><i className="fas fa-check"/>Approve & Enroll</button>
            </div>
          )}
        </>}
      </Modal>
    </div>
  );
}

// ─── Admin Schedule Session Page ─────────────────────────────────────────────
function AdminSchedulePage({ users, sessions, setSessions }) {
  const [form, setForm] = useState({ studentId:'', counselorId:'u1', date:'', time:'', type:'counseling', notes:'' });
  const [success, setSuccess] = useState('');
  const students = users.filter(u=>(u.role==='student'&&u.enrolled)||u.role==='peer');
  const counselors = users.filter(u=>u.role==='counselor');

  const submit = (e) => {
    e.preventDefault();
    const student = users.find(u=>u.id===form.studentId);
    const s = {
      id:'sess'+Date.now(),
      studentId: form.studentId,
      counselorId: form.counselorId,
      studentName: student ? student.name : 'Unknown',
      date: form.date,
      time: form.time,
      status: 'upcoming',
      type: 'video',
      sessionType: form.type,
      anonymous: true,
      notes: form.notes,
      scheduledByAdmin: true,
    };
    setSessions(p=>[...p,s]);
    setSuccess('Session scheduled successfully for '+s.studentName+' on '+s.date+' at '+s.time);
    setForm({ studentId:'', counselorId:'u1', date:'', time:'', type:'counseling', notes:'' });
    setTimeout(()=>setSuccess(''),4000);
  };

  return (
    <div className="animate-fade">
      <div className="page-header">
        <div className="page-title">Schedule a Session</div>
        <div className="page-subtitle">Arrange video counseling or peer support sessions for any student or peer supporter</div>
      </div>
      <div className="grid-2" style={{alignItems:'start'}}>
        <div className="card">
          <h3 style={{fontWeight:700,marginBottom:20,fontSize:16}}>Create New Session</h3>
          {success&&<div className="alert alert-success" style={{marginBottom:16}}><i className="fas fa-check-circle"/>{success}</div>}
          <form onSubmit={submit}>
            <div className="form-group">
              <label className="label">Participant (Student or Peer Supporter)</label>
              <select className="select" required value={form.studentId} onChange={e=>setForm({...form,studentId:e.target.value})}>
                <option value="">Select a participant...</option>
                <optgroup label="Enrolled Students">
                  {students.filter(u=>u.role==='student').map(u=><option key={u.id} value={u.id}>{u.name} ({u.email})</option>)}
                </optgroup>
                <optgroup label="Peer Supporters">
                  {students.filter(u=>u.role==='peer').map(u=><option key={u.id} value={u.id}>{u.name} ({u.email})</option>)}
                </optgroup>
              </select>
            </div>

// ─── Wellness Resources Page (Admin view + modal system) ──────────────────────
function WellnessResourcesPage({ isAdminView, startModal, onClose, standalone }) {
  const [activeModal, setActiveModal] = useState(startModal||null);
  useEffect(()=>{ if(startModal) setActiveModal(startModal); },[startModal]);
  const handleClose = () => { setActiveModal(null); if(onClose) onClose(); };
  const [journal, setJournal] = useState('');
  const [journalSaved, setJournalSaved] = useState(false);
  const [breathStep, setBreathStep] = useState(0);
  const [breathRunning, setBreathRunning] = useState(false);
  const breathTimerRef = useRef(null);
  const breathSteps = [
    {label:'Inhale',duration:4,color:'#5b6cf9'},
    {label:'Hold',duration:7,color:'#f59e0b'},
    {label:'Exhale',duration:8,color:'#38c88c'},
  ];
  const [breathCount, setBreathCount] = useState(0);
  const [breathSec, setBreathSec] = useState(breathSteps[0].duration);

  useEffect(()=>{
    if(!breathRunning) return;
    const interval = setInterval(()=>{
      setBreathSec(prev=>{
        if(prev<=1) {
          setBreathStep(s=>{
            const next=(s+1)%3;
            if(next===0) setBreathCount(c=>c+1);
            setBreathSec(breathSteps[next].duration);
            return next;
          });
          return breathSteps[0].duration;
        }
        return prev-1;
      });
    },1000);
    breathTimerRef.current=interval;
    return ()=>clearInterval(interval);
  },[breathRunning]);

  const saveJournal = () => {
    setJournalSaved(true);
    setTimeout(()=>setJournalSaved(false),2500);
  };

  const resources = [
    { id:'breathing', icon:'🧘', title:'4-7-8 Breathing Exercise', desc:'An evidence-based breathing technique for immediate anxiety and stress relief.', color:'#eef0ff', accent:'#5b6cf9', tag:'Anxiety Relief' },
    { id:'journal', icon:'📓', title:'Mood Journal', desc:'Write freely about your thoughts and feelings. Journaling reduces stress and builds self-awareness.', color:'#f0fdf4', accent:'#38c88c', tag:'Self-Reflection' },
    { id:'hotline', icon:'☎️', title:'Crisis Hotline', desc:'24/7 confidential support. If you are in immediate distress, reach out now.', color:'#fff1f3', accent:'#f43f5e', tag:'Immediate Help' },
    { id:'library', icon:'📚', title:'Self-Help Library', desc:'Curated articles, videos, and exercises for managing mental health day-to-day.', color:'#fffbeb', accent:'#f59e0b', tag:'Resources' },

    return (
      <span>

            <div style={{width:160,height:160,borderRadius:'50%',border:`6px solid ${breathSteps[breathStep].color}`,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',margin:'0 auto 24px',transition:'border-color .5s',background:breathSteps[breathStep].color+'15'}}>

            </div>
            <div style={{display:'flex',justifyContent:'center',gap:8,marginBottom:24}}>
              {breathSteps.map((s,i)=><div key={i} style={{padding:'6px 14px',borderRadius:20,background:breathStep===i?s.color:'#f3f4f6',color:breathStep===i?'#fff':'#9ca3af',fontSize:13,fontWeight:600,transition:'all .3s'}}>{s.label} {s.duration}s</div>)}

            {breathCount>0&&<div style={{marginBottom:16,color:'#059669',fontWeight:600,fontSize:14}}>{breathCount} cycle{breathCount>1?'s':''} completed</div>}
            <div style={{display:'flex',gap:12,justifyContent:'center'}}>
              <button className="btn btn-primary" onClick={()=>setBreathRunning(!breathRunning)}><i className={`fas fa-${breathRunning?'pause':'play'}`}/>{breathRunning?'Pause':'Start'}</button>

            </div>
          </div>
        </Modal>
        <Modal show={activeModal==='journal'} onClose={handleClose} title="Mood Journal" wide>

            </div>
          ))}
        </Modal>
        <Modal show={activeModal==='library'} onClose={handleClose} title="Self-Help Library" wide>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
            {[{cat:'Anxiety',icon:'😰',items:['Understanding panic attacks','5-4-3-2-1 grounding technique','Journaling for anxiety relief','Cognitive restructuring']},{cat:'Depression',icon:'🌧️',items:['Behavioral activation guide','Building a daily routine','Exercise and mental health','When to seek professional help']},{cat:'Stress',icon:'🔥',items:['Time management strategies','Setting healthy boundaries','The stress-sleep connection','Mindfulness in 5 minutes']},{cat:'Self-Esteem',icon:'💚',items:['Identifying negative self-talk','Building self-compassion','Celebrating small wins','Imposter syndrome explained']}].map((section,i)=>(

              </div>
            ))}
          </div>
        </Modal>
      </span>

  }

  return (

                  <i className="fas fa-arrow-right"/> {r.id==='breathing'?'Start Exercise':r.id==='journal'?'Open Journal':r.id==='hotline'?'View Contacts':'Browse Resources'}

        <div style={{textAlign:'center',padding:'12px 0'}}>
          <p style={{color:'#6b7280',marginBottom:24,fontSize:14}}>Breathe in for 4 seconds, hold for 7, exhale for 8. Repeat 3-4 times for immediate calm.</p>

        {[
          {icon:'fa-users',value:users.length,label:'Total Users',color:'#5b6cf9',bg:'#eef0ff'},
          {icon:'fa-file-alt',value:pending,label:'Pending Applications',color:'#f59e0b',bg:'#fffbeb'},
          {icon:'fa-user-check',value:enrolled,label:'Enrolled Students',color:'#38c88c',bg:'#f0fdf4'},
          {icon:'fa-book-open',value:stories.length,label:'Healed Stories',color:'#8b5cf6',bg:'#f3effe'},
        ].map((s,i)=>(
          <div key={i} className="stat-card">
            <div className="stat-icon" style={{background:s.bg,color:s.color}}><i className={`fas ${s.icon}`}/></div>
            <div className="stat-value" style={{color:s.color}}>{s.value}</div>
            <div className="stat-label">{s.label}</div>
          </div>
        ))}
      </div>
      {pending>0&&<div className="card" style={{borderLeft:'4px solid #f59e0b',marginBottom:20}}><div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><div><strong style={{color:'#92400e'}}>{pending} application{pending>1?'s':''} awaiting review</strong><div style={{color:'#6b7280',fontSize:14,marginTop:4}}>Students are waiting for access to mental health support.</div></div><button className="btn btn-primary btn-sm" onClick={()=>setPage('applications')}>Review Now</button></div></div>}
      <div className="grid-2">
        <div className="card"><div style={{fontWeight:700,marginBottom:16}}>Recent Applications</div>{applications.slice(0,3).map(a=><div key={a.id} style={{display:'flex',gap:10,alignItems:'center',marginBottom:12}}><Avatar name={a.name} color="#5b6cf9" size={32} fontSize={12}/><div style={{flex:1}}><div style={{fontWeight:600,fontSize:14}}>{a.name}</div><div style={{fontSize:12,color:'#9ca3af'}}>{a.urgency} urgency · {a.date}</div></div><span className={`badge ${a.status==='pending'?'badge-warning':a.status==='approved'?'badge-success':'badge-danger'}`}>{a.status}</span></div>)}</div>
        <div className="card"><div style={{fontWeight:700,marginBottom:16}}>Quick Stats</div>{[{label:'Stories Published',val:stories.length},{label:'Total Sessions',val:sessions.length},{label:'Active Counselors',val:counselors},{label:'Peer Supporters',val:users.filter(u=>u.role==='peer').length}].map((s,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid #f3f4f6',fontSize:14}}><span style={{color:'#6b7280'}}>{s.label}</span><strong>{s.val}</strong></div>)}</div>
      </div>
    </div>
  );

  if (user.role==='counselor') return (
    <div className="animate-fade">
      <div className="page-header"><div className="page-title">Good morning, Dr. {user.name.split(' ')[1]} 👋</div><div className="page-subtitle">You have {upcoming.length} session{upcoming.length!==1?'s':''} scheduled today</div></div>
      <div className="grid-4" style={{marginBottom:24}}>
        {[{icon:'fa-users',value:enrolled,label:"Active Students",color:'#5b6cf9',bg:'#eef0ff'},{icon:'fa-calendar',value:upcoming.length,label:'Sessions Today',color:'#38c88c',bg:'#f0fdf4'},{icon:'fa-book-open',value:stories.length,label:'Stories Published',color:'#8b5cf6',bg:'#f3effe'},{icon:'fa-star',value:'4.9',label:'Avg. Rating',color:'#f59e0b',bg:'#fffbeb'}].map((s,i)=><div key={i} className="stat-card"><div className="stat-icon" style={{background:s.bg,color:s.color}}><i className={`fas ${s.icon}`}/></div><div className="stat-value" style={{color:s.color}}>{s.value}</div><div className="stat-label">{s.label}</div></div>)}
      </div>
      <div className="card"><div style={{fontWeight:700,marginBottom:16}}>Today's Sessions</div>{upcoming.map(s=><div key={s.id} style={{display:'flex',alignItems:'center',gap:16,padding:'12px 0',borderBottom:'1px solid #f9fafb'}}><div style={{background:'#eef0ff',borderRadius:10,padding:'10px 14px',textAlign:'center'}}><div style={{fontSize:14,fontWeight:700,color:'#5b6cf9'}}>{s.time}</div></div><div style={{flex:1}}><div style={{fontWeight:600}}>{s.studentName}</div><div style={{fontSize:13,color:'#9ca3af'}}><i className="fas fa-user-secret" style={{color:'#38c88c'}}/> Anonymous video session</div></div><button className="btn btn-primary btn-sm" onClick={()=>setPage('sessions')}><i className="fas fa-video"/>Join</button></div>)}{upcoming.length===0&&<div style={{textAlign:'center',color:'#9ca3af',padding:20}}>No sessions scheduled today</div>}</div>
    </div>
  );

  // Student / Peer dashboard
  return (
    <div className="animate-fade">
      <div style={{background:'linear-gradient(135deg,#667eea,#764ba2)',borderRadius:20,padding:'28px 32px',color:'#fff',marginBottom:24,position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',top:-20,right:-20,width:160,height:160,background:'rgba(255,255,255,.08)',borderRadius:'50%'}}/>
        <div style={{position:'absolute',bottom:-40,right:60,width:100,height:100,background:'rgba(255,255,255,.05)',borderRadius:'50%'}}/>
        <div style={{fontSize:22,fontWeight:800,marginBottom:6}}>Welcome back, {user.name.split(' ')[0]} 🌱</div>
        <div style={{opacity:.85,fontSize:15,marginBottom:20}}>You're doing great. Here's your support hub.</div>
        <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
          {user.enrolled&&<button className="btn" style={{background:'rgba(255,255,255,.2)',color:'#fff',border:'none'}} onClick={()=>setPage('sessions')}><i className="fas fa-video"/>Book Session</button>}
          <button className="btn" style={{background:'rgba(255,255,255,.2)',color:'#fff',border:'none'}} onClick={()=>setPage('stories')}><i className="fas fa-book-open"/>Read Stories</button>
          <button className="btn" style={{background:'rgba(255,255,255,.2)',color:'#fff',border:'none'}} onClick={()=>setPage('messages')}><i className="fas fa-comments"/>Message Counselor</button>
        </div>
      </div>
      {!user.enrolled&&user.role==='student'&&<div className="alert alert-warning" style={{marginBottom:20}}><i className="fas fa-clock"/><div><strong>Enrollment pending.</strong> Some features are restricted until your application is approved. <a href="#" style={{color:'#92400e',fontWeight:600}} onClick={e=>{e.preventDefault();setPage('enroll');}}>Check status →</a></div></div>}
      {myUpcoming.length>0&&<div className="card" style={{marginBottom:20,borderLeft:'4px solid #5b6cf9'}}><div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><div><div style={{fontWeight:700,fontSize:16}}>Next Session</div><div style={{color:'#6b7280',fontSize:14}}>{myUpcoming[0].date} at {myUpcoming[0].time} · Anonymous video</div></div><button className="btn btn-primary btn-sm" onClick={()=>setPage('sessions')}><i className="fas fa-video"/>Join</button></div></div>}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:16}}>Wellness Resources</div>
        <button className="btn btn-outline btn-sm" onClick={()=>setPage('wellness')}><i className="fas fa-th-large"/>View All</button>
      </div>
      <div className="grid-2" style={{marginBottom:24}}>
        {resources.map((r,i)=>(
          <div key={i} className="card" style={{background:r.color,cursor:'pointer',display:'flex',gap:14,alignItems:'center',padding:'18px',borderLeft:'3px solid '+r.accent}} onClick={()=>setWellnessModal(r.id)}>
            <div style={{fontSize:28}}>{r.icon}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,color:'#1a202c'}}>{r.title}</div>
              <div style={{fontSize:13,color:'#4b5563',marginTop:4}}>{r.desc}</div>
            </div>
            <button className="btn btn-sm" style={{background:r.accent,color:'#fff',border:'none',flexShrink:0}} onClick={e=>{e.stopPropagation();setWellnessModal(r.id);}}>{r.action}</button>
          </div>
        ))}
      </div>
      {/* Inline wellness modals reuse WellnessResourcesPage modal logic */}
      {wellnessModal&&<WellnessResourcesPage isAdminView={false} startModal={wellnessModal} onClose={()=>setWellnessModal(null)} standalone />}
      <div style={{fontWeight:700,fontSize:16,marginBottom:16}}>Recent Stories</div>
      <div className="grid-2">
        {stories.slice(0,2).map(s=><div key={s.id} className="story-card" onClick={()=>setPage('stories')}><div style={{marginBottom:8}}>{s.tags.slice(0,2).map(t=><span key={t} className="tag">{t}</span>)}</div><div style={{fontWeight:700,fontSize:14,lineHeight:1.45,marginBottom:8}}>{s.title}</div><div style={{fontSize:12,color:'#9ca3af'}}>{s.likes} likes · {s.views} views</div></div>)}
      </div>
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [users, setUsers] = useState(SEED_USERS);
  const [applications, setApplications] = useState(SEED_APPLICATIONS);
  const [stories, setStories] = useState(SEED_STORIES);
  const [sessions, setSessions] = useState(SEED_SESSIONS);
  const [messages, setMessages] = useState(SEED_MESSAGES);
  const [currentUser, setCurrentUser] = useState(null);
  const [page, setPage] = useState('dashboard');

  const login = (user) => { setCurrentUser(user); setPage('dashboard'); };
  const logout = () => { setCurrentUser(null); setPage('dashboard'); };

  if (!currentUser) return (
    <LandingPage onLogin={login} users={users} setUsers={setUsers} applications={applications} setApplications={setApplications} />
  );

  const renderPage = () => {
    switch(page) {
      case 'dashboard': return <Dashboard user={currentUser} users={users} stories={stories} sessions={sessions} applications={applications} setPage={setPage} />;
      case 'stories': return <StoriesPage user={currentUser} stories={stories} setStories={setStories} />;
      case 'add-story': return <AddStoryPage user={currentUser} stories={stories} setStories={setStories} />;
      case 'sessions': return <SessionsPage user={currentUser} sessions={sessions} setSessions={setSessions} users={users} />;
      case 'messages': return <MessagesPage user={currentUser} users={users} messages={messages} setMessages={setMessages} />;
      case 'enroll': return <EnrollmentPage user={currentUser} />;
      case 'applications': return <ApplicationsPage applications={applications} setApplications={setApplications} users={users} setUsers={setUsers} />;
      case 'users': return <UsersPage users={users} />;
      case 'sessions-admin': return <SessionsPage user={currentUser} sessions={sessions} setSessions={setSessions} users={users} />;
      case 'stories-admin': return <StoriesPage user={currentUser} stories={stories} setStories={setStories} />;
      case 'students': return <UsersPage users={users.filter(u=>u.role==='student')} />;
      case 'schedule-session': return <AdminSchedulePage users={users} sessions={sessions} setSessions={setSessions} />;
      case 'wellness': return <WellnessResourcesPage isAdminView={false} />;
      case 'wellness-admin': return <WellnessResourcesPage isAdminView={true} />;
      default: return <Dashboard user={currentUser} users={users} stories={stories} sessions={sessions} applications={applications} setPage={setPage} />;
    }
  };

  return (
    <div>
      <Sidebar user={currentUser} page={page} setPage={setPage} onLogout={logout} />
      <div className="main-content">{renderPage()}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
